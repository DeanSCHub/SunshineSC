<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mantis Sunshine</title>
<style>
:root{
  --font:"DIN Alternate","Bahnschrift","D-DIN","Barlow","Helvetica Neue",Arial,sans-serif;
  --font-cond:"DIN Condensed","Bahnschrift SemiBold SemiConden","Bahnschrift","Barlow Condensed","Arial Narrow",sans-serif;
  --r:12px;
}
:root,:root[data-theme="light"]{
  color-scheme:light;
  --paper:#eef2f5;
  --ink:#1d2a33;
  --muted:#5b6b76;
  --line:rgba(29,42,51,.12);
  --line-strong:rgba(29,42,51,.22);
  --chrome:#fafcfd;
  --chrome-solid:#fafcfd;
  --hover:rgba(29,42,51,.06);
  --lamp:#c27c07;
  --fault:#d33a2c;--wo:#2563c9;--badge-ink:#ffffff;
  --lamp-ink:#8a5600;
  --lamp-wash:rgba(242,179,61,.18);
  --view:rgba(194,124,7,.9);
  --shadow:0 1px 2px rgba(17,30,40,.08),0 8px 28px rgba(17,30,40,.12);
__PAL_LIGHT__
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0e1a22;
  --ink:#d9e3ea;
  --muted:#8fa1ad;
  --line:rgba(201,214,223,.13);
  --line-strong:rgba(201,214,223,.24);
  --chrome:#13232d;
  --chrome-solid:#13232d;
  --hover:rgba(201,214,223,.07);
  --lamp:#f2b33d;
  --fault:#ff6b5c;--wo:#6ea8ff;--badge-ink:#0e1a22;
  --lamp-ink:#f2b33d;
  --lamp-wash:rgba(242,179,61,.14);
  --view:rgba(242,179,61,.95);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
__PAL_DARK__
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0e1a22;--ink:#d9e3ea;--muted:#8fa1ad;--line:rgba(201,214,223,.13);--line-strong:rgba(201,214,223,.24);
    --chrome:#13232d;--chrome-solid:#13232d;--hover:rgba(201,214,223,.07);--lamp:#f2b33d;--lamp-ink:#f2b33d;--fault:#ff6b5c;--wo:#6ea8ff;--badge-ink:#0e1a22;
    --lamp-wash:rgba(242,179,61,.14);--view:rgba(242,179,61,.95);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
__PAL_DARK__
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

/* ---------- map ---------- */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--paper)}
#stage.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.moving{will-change:transform}
#map{display:block;overflow:hidden}
#map.lod0 .z1,#map.lod0 .z2,#map.lod1 .z1{display:none}
#map text{font-family:var(--font);text-rendering:geometricPrecision}
#map .b{font-weight:700}
.m path{fill:none}
.lyr[hidden]{display:none}
#pins path{fill:var(--lamp);stroke:var(--paper);stroke-width:1.2}
#pins circle{fill:var(--paper)}
/* live badges: drawn in map units, then scaled so they stay a readable size at any zoom */
#badges .bdg{transform:scale(var(--bk,1))}
#badges .bf{fill:var(--fault);stroke:var(--paper);stroke-width:1.6}
#badges .br{fill:var(--paper);stroke:var(--fault);stroke-width:1.8}
#badges .bw{fill:var(--wo);stroke:var(--paper);stroke-width:1.6}
#badges text{font-family:var(--font);font-weight:700;font-size:8.5px;text-anchor:middle;dominant-baseline:central;fill:var(--badge-ink)}
#badges .br+text{fill:var(--fault)}
@media (prefers-reduced-motion:no-preference){
  #badges .pulse{fill:none;stroke:var(--fault);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:bpulse 2s ease-out 3 forwards}
  @keyframes bpulse{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
}
#hl rect{fill:none;stroke:var(--lamp);stroke-width:3;vector-effect:non-scaling-stroke}
#hl .ring{fill:none;stroke:var(--lamp);stroke-width:2;vector-effect:non-scaling-stroke;opacity:0}
@media (prefers-reduced-motion:no-preference){
  #hl .ring.go{animation:lamp 1.1s ease-out 1}
  @keyframes lamp{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
}
#hl .ring{transform-box:fill-box;transform-origin:center}

/* ---------- floating chrome ---------- */
#top,#bottom,.pop,#sheet{position:fixed;zoom:var(--ui,1)}
#stage{-webkit-touch-callout:none}
/* ---------- editor ---------- */
#edbar,#edhint,#edlg form{zoom:var(--ui,1)}
#edbar{position:fixed;z-index:12;left:max(12px,env(safe-area-inset-left));top:calc(max(12px,env(safe-area-inset-top)) + 64px);width:132px;padding:8px;display:flex;flex-direction:column;gap:6px}
#edbar[hidden],#edhint[hidden],#edlg[hidden]{display:none}
#edbar .edtitle{font-size:12px;color:var(--muted);font-weight:600;padding:2px 4px;letter-spacing:.04em;text-transform:uppercase}
#edbar button,#edhint button,.edrow button,#edlg button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--chrome-solid);font-size:15px;font-weight:600;padding:0 12px;text-align:left}
#edbar button.on{background:var(--lamp-wash);border-color:var(--lamp);color:var(--lamp-ink)}
.edcols{display:flex;gap:6px;padding:4px 2px}
.edcols button{width:26px;min-height:26px!important;height:26px;padding:0!important;border-radius:50%!important;border:2px solid var(--chrome-solid)!important;box-shadow:0 0 0 1px var(--line-strong)}
.edcols button.on{box-shadow:0 0 0 3px var(--lamp)}
#edhint{position:fixed;z-index:13;left:50%;transform:translateX(-50%);top:calc(max(12px,env(safe-area-inset-top)) + 64px);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;font-size:15px;max-width:calc(100vw - 32px)}
#edhint button.primary,#edlg button.primary{background:var(--lamp);border-color:var(--lamp);color:#fff}
#edlg{position:fixed;inset:0;z-index:30;background:rgba(10,20,28,.35);display:flex;align-items:center;justify-content:center;padding:16px}
#edlg form{width:min(420px,100%);padding:18px;border-radius:14px;max-height:90vh;overflow:auto}
#edlg h2{margin:0 0 12px;font-size:20px}
#edlg label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:10px 0 4px}
#edlg input,#edlg select{width:100%;box-sizing:border-box;min-height:44px;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);-webkit-user-select:text;user-select:text}
#edlg p{font-size:13px;color:var(--muted);margin:10px 0 0}
#edlg p:empty{display:none}
.edbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.edrow{display:flex;flex-wrap:wrap;gap:8px;padding:4px 10px 8px}
.edrow button.danger{color:var(--fault);border-color:var(--fault)}
.edlink{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:14px}
.edlink span{flex:1;min-width:0;word-break:break-word}
.edlink button{min-height:36px!important;min-width:36px;padding:0 10px!important;text-align:center!important}
.edtag{font-size:11px;font-weight:600;color:var(--lamp-ink);background:var(--lamp-wash);border-radius:4px;padding:1px 6px;margin-left:6px}
#map .edhide{display:none}
#edits text,#eddraft text{font-family:var(--font)}
#edits .lbl{fill:var(--ink)}
#edits .sig{fill:#e5484d;stroke:var(--ink);stroke-width:1.2}
#edits .post{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
#edits .bx{fill:var(--chrome-solid);stroke:var(--ink);stroke-width:1}
#edits .bxw{fill:none;stroke:var(--ink);stroke-width:1}
#edits .dia{fill:var(--lamp);stroke:var(--ink);stroke-width:1}
#edits .tc{fill:#5b5bd6}
#edits .new{stroke:var(--lamp);stroke-width:1;stroke-dasharray:3 2;fill:none}
#eddraft *{stroke-dasharray:4 3}
#top,#bottom{z-index:10}
.chrome{background:var(--chrome);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);}
#top{left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));
  display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;pointer-events:none;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
#top>*{pointer-events:auto}
#brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 12px;min-height:48px}
#brand .lampdot{width:10px;height:10px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 3px var(--lamp-wash)}
#brand b{font-family:var(--font-cond);font-weight:700;font-size:26px;line-height:1;letter-spacing:.01em;padding-top:3px}
#brand span{font-size:14px;color:var(--muted);white-space:nowrap}
#searchbox{position:relative;flex:1;max-width:440px;min-width:0}
#sfield{position:relative;display:flex;align-items:center;gap:8px;padding:0 12px;min-height:48px}
#q{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding:12px 0;-webkit-user-select:text;user-select:text}
#q::placeholder{color:var(--muted)}
#results{position:absolute;left:0;right:0;top:56px;max-height:min(60vh,440px);overflow:auto;padding:6px;display:none}
#results.open{display:block}
.res{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;
  border-radius:8px;padding:10px 10px;min-height:44px}
.res:hover,.res.on{background:var(--hover)}
.res b{font-weight:600;font-size:16px}
.res small{color:var(--muted);font-size:13px;white-space:nowrap}
.res .empty{color:var(--muted);padding:12px}
.spacer{flex:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:48px;min-height:48px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--chrome);box-shadow:var(--shadow);font-size:15px;white-space:nowrap}
.iconbtn:hover{background:var(--chrome-solid)}
.iconbtn[aria-expanded="true"]{border-color:var(--lamp);color:var(--lamp-ink)}
.iconbtn svg{width:20px;height:20px;flex:none}
.iconbtn .lbl{display:inline}
@media (max-width:900px){.iconbtn .lbl{display:none}.iconbtn{padding:0}#brand span{display:none}}
@media (max-width:560px){#brand{padding:8px 10px}#brand b{font-size:22px}}

/* ---------- popovers ---------- */
.pop{position:fixed;z-index:20;right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 58px);
  width:min(340px,calc(100vw - 24px));padding:8px;display:none}
.pop.open{display:block}
.pop h2{font-size:13px;font-weight:600;color:var(--muted);margin:8px 10px 6px;letter-spacing:.02em}
.toggle{display:flex;align-items:center;gap:12px;width:100%;padding:10px;min-height:48px;border:0;background:none;border-radius:8px;text-align:left}
.toggle:hover{background:var(--hover)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:0 10px 10px 44px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.legend i{width:16px;height:6px;border-radius:3px}
.legend em{font-style:normal}
.legend .lb{width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--badge-ink)}
.lb.f{background:var(--fault)} .lb.r{background:var(--paper);border:2px solid var(--fault);color:var(--fault);width:12px;height:12px;font-size:9px} .lb.w{background:var(--wo);border-radius:4px}
#sheet .livehd{display:flex;align-items:baseline;justify-content:space-between;margin:12px 10px 4px}
#sheet .livehd h3{margin:0}
#sheet .livehd small{font-size:12px;color:var(--muted)}
.sample{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:var(--lamp-wash);color:var(--lamp-ink);font-size:11px;font-weight:600}
.doc.live .ic{font-weight:700;font-size:15px}
.doc.live.f .ic{background:var(--fault);color:var(--badge-ink)}
.doc.live.r .ic{background:none;border:2px solid var(--fault);color:var(--fault)}
.doc.live.w .ic{background:var(--wo);color:var(--badge-ink)}
.toggle .sw{width:22px;height:22px;border-radius:6px;flex:none;border:1px solid var(--line-strong)}
.toggle .tx{flex:1}
.toggle .tx b{display:block;font-weight:600;font-size:16px}
.toggle .tx small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.toggle .knob{width:42px;height:26px;border-radius:13px;background:var(--line-strong);position:relative;flex:none;transition:background .15s}
.toggle .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--chrome-solid);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle[aria-checked="true"] .knob{background:var(--lamp)}
.toggle[aria-checked="true"] .knob::after{transform:translateX(16px)}

/* ---------- tool box drawer ---------- */
#toolbox{width:min(300px,calc(100vw - 24px));max-height:calc(100vh - 96px);overflow:auto}
.links{display:grid;grid-template-columns:1fr;gap:4px;padding:0 4px 6px}
.links a{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:56px;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none;border:1px solid transparent}
.links a:hover{background:var(--hover);border-color:var(--line)}
.links a b{font-weight:600;font-size:15px;line-height:1.2}
.links a small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{color:var(--muted);font-size:13px;line-height:1.5;padding:10px 10px 6px;border-top:1px solid var(--line);margin-top:6px}
.note a{color:var(--lamp-ink)}

/* ---------- asset sheet ---------- */
#sheet{z-index:15;right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 64px);bottom:96px;width:360px;
  display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .22s ease-out;overflow:hidden}
#sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
#sheet header{display:flex;align-items:flex-start;gap:10px;padding:16px 10px 12px 18px;border-bottom:1px solid var(--line)}
#sheet header .t{flex:1;min-width:0}
#sheet h1{margin:0;font-family:var(--font-cond);font-weight:700;font-size:32px;line-height:1.05;letter-spacing:.01em;word-break:break-word;padding-top:3px}
#sheet .kind{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;color:var(--muted)}
#sheet .kind i{width:9px;height:9px;border-radius:50%;background:var(--lamp)}
#sheet .close{min-width:44px;min-height:44px;border:0;background:none;border-radius:8px;display:flex;align-items:center;justify-content:center}
#sheet .close:hover{background:var(--hover)}
#sheet .body{overflow:auto;padding:8px 8px 14px;flex:1}
#sheet h3{font-size:13px;font-weight:600;color:var(--muted);margin:12px 10px 4px;letter-spacing:.02em}
.doc{display:flex;align-items:center;gap:12px;padding:10px;min-height:52px;border-radius:8px;color:inherit;text-decoration:none}
.doc:hover{background:var(--hover)}
.doc .ic{width:34px;height:34px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--hover);color:var(--muted)}
.doc .ic svg{width:18px;height:18px}
.doc .dt{flex:1;min-width:0}
.doc .dt b{display:block;font-weight:600;font-size:15px;line-height:1.25;word-break:break-word}
.doc .dt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.doc.primary .ic{background:var(--lamp-wash);color:var(--lamp-ink)}
.doc.missing{opacity:.75;cursor:default}
.doc.missing:hover{background:none}
.coords{font-size:13px;color:var(--muted);padding:0 10px 4px}
@media (max-width:820px){
  #sheet{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:auto;bottom:max(8px,env(safe-area-inset-bottom));width:auto;max-height:58vh;
    transform:translateY(calc(100% + 24px))}
  #sheet.open{transform:none}
}

/* ---------- bottom bar: minimap + zoom ---------- */
#bottom{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));
  display:flex;align-items:stretch;gap:10px;pointer-events:none;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
#bottom>*{pointer-events:auto}
#mini{flex:1;max-width:760px;height:64px;padding:6px 10px;position:relative;touch-action:none;cursor:crosshair}
#mini svg{width:100%;height:100%;display:block}
#mini line{stroke:var(--muted);stroke-width:14;stroke-linecap:round}
#mini .vp{fill:var(--lamp-wash);stroke:var(--view);stroke-width:16;vector-effect:none}
#mini .stn{fill:var(--p-station,var(--ink))}
#guide{align-self:stretch;display:flex;align-items:center;font-size:12px;color:var(--muted);padding:8px 12px;max-width:220px;line-height:1.35}
.zoom{display:flex;flex-direction:column;gap:6px}
.zoom .iconbtn{min-height:0;height:calc((64px - 6px)/2);min-width:48px;padding:0}
@media (max-width:820px){#guide{display:none}}
@media (max-width:820px){body.sheet-open #bottom{display:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="stage" aria-label="Signalling map. Drag to pan, pinch or scroll to zoom, tap an asset for its drawings.">
  <div id="world">
    <svg id="map" class="m" xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 __Y0__ __W__ __H__" preserveAspectRatio="none">
      <g id="L-base">__L_base__</g>
      <g id="L-supply" class="lyr">__L_supply__</g>
      <g id="L-approach" class="lyr" hidden>__L_approach__</g>
      <g id="L-speed" class="lyr" hidden>__L_speed__</g>
      <g id="L-tpws" class="lyr">__L_tpws__</g>
      <g id="L-kp" class="lyr" hidden>__L_kp__</g>
      <g id="edits"></g>
      <g id="eddraft"></g>
      <g id="pins" class="lyr"></g>
      <g id="badges" class="lyr"></g>
      <g id="hl"></g>
    </svg>
  </div>
</div>

<div id="top" class="chrome">
  <div id="brand" class="chrome"><i class="lampdot" aria-hidden="true"></i><b>Mantis</b><span>Sunshine region</span></div>
  <div id="searchbox">
    <div class="chrome" id="sfield">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Find a signal, location, station or road" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Search the map" aria-controls="results">
    </div>
    <div id="results" class="chrome" role="listbox" aria-label="Search results"></div>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="btnLayers" aria-expanded="false" aria-controls="layers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span class="lbl">Layers</span></button>
  <button class="iconbtn" id="btnTools" aria-expanded="false" aria-controls="toolbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2M3 12h18"/></svg><span class="lbl">Tool box</span></button>
  <button class="iconbtn" id="btnTheme" aria-label="Switch to dark mode">
    <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
    <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<div id="layers" class="chrome pop" role="dialog" aria-label="Map layers">

<script>

/* ================= theme ================= */

$("#btnTheme").onclick = () => { const t = currentTheme() === "dark" ? "light" : "dark"; applyTheme(t); store.set("theme", t); };

/* ================= view state ================= */
let s = 1, tx = 0, ty = 0, dirty = true, minS = 0.02, maxS = 6;

// only the grid cells near the drawn area are switched on, so each redraw handles a small slice of the map
const CELL = __CELL__, CELLS = [...document.querySelectorAll("#map .cell")].map(el => {

});

}

    const k = d > 0 ? [1, d, 0] : [0, area, name ? 0 : 1];
    if (!key || k[0] < key[0] || (k[0] === key[0] && (k[1] < key[1] || (k[1] === key[1] && k[2] < key[2])))){ key = k; best = l; }
  };
  for (const t of TARGETS) consider(t.r, t.l, t.name);
  if (pinsOn) for (const p of PINS) consider([p.cx - 7, p.cy - 12, p.cx + 7, p.cy + 6], p, 1);
  if (LIVE.size && !badgesEl.hasAttribute("hidden")){
    const bk = Math.min(8, Math.max(0.7, 1.4 / s));
    for (const id of LIVE.keys()){
      const a = ASSETS.get(id);
      if (!a) continue;
      const sp = badgeSpots(a), x0 = sp[0].x - BADGE_R, y = sp[0].y;
      const x1 = x0 + sp.length * (BADGE_R * 2 + 2) * bk;
      consider([x0, y + BADGE_R - 2 * BADGE_R * bk, x1, y + BADGE_R], primaryLink(a), 1);
    }

  return best;
}
function onTap(px, py){
  const [mx, my] = toMap(px, py);
  const now = performance.now();
  const dbl = now - lastTap.t < 320 && Math.hypot(px - lastTap.x, py - lastTap.y) < 30;
  lastTap = { t: now, x: px, y: py };
  if (dbl && !(EDIT.on && EDIT.tool !== "select")){ fly(scaledAround2(2.2, px, py)); return; }
  if (EDIT.on && editTap(mx, my, px, py)) return;
  const hit = hitTest(mx, my);
  if (hit && s > fitScale() * 2.2) { select(hit); return; }
  if (s <= fitScale() * 2.2){ fly(scaledAround2(Math.max(4, 0.35 / s), px, py)); return; }
  closeSheet();
}
function scaledAround2(f, cx, cy){
  const ns = Math.max(minS, Math.min(maxS, s * f));
  return { s: ns, tx: cx - (cx - tx) * ns / s, ty: cy - (cy - ty) * ns / s };
}

function pinRows(p){

function nearestPin(r, maxD){

function fileKey(l){ try { return decodeURIComponent(decodeURIComponent(l.u.split("?")[0])).split("/").pop().toLowerCase(); } catch(e){ return l.u.toLowerCase(); } }
function uniqueDocs(list){

    const k = fileKey(l), cur = by.get(k);
    const rank = x => (x.u.includes("/~Assets/") ? 0 : 1) + (x.u.includes("/sites/SCMantis/") ? 0 : 2);

}
function areaDrawings(x, y){

    const dy = l.cy - y, score = Math.abs(dy) + (dy < 0 ? 400 : 0);
    if (!best[l.t] || score < best[l.t].score) best[l.t] = { l, score };

function ago(t){

function liveRows(list){

      ? `Work order ${esc(i.ref)} · ${esc(i.status)} · due ${esc(i.due)}`
      : `Fault ${esc(i.ref)} · ${i.open ? "open" : "cleared"} · ${i.open ? "reported" : "cleared"} ${ago(i.when)}`;
    return `<a class="doc live ${c}" href="${esc(i.url || "#")}" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">${c === "w" ? "W" : "!"}</span>

let selected = null;
function select(l, fromSearch){

    let near = null, nd = 220;

      const d = dist2rect(l.cx, l.cy, a.r); if (d < nd){ nd = d; near = a; }
    }
    title = l.p ? l.p.split(",")[0].replace(/\+/g, " ") : near ? near.id : "Access point";
    kind = near && !l.p ? `Directions to ${assetType(near).toLowerCase()}` : "Directions";

  } else if (l.a && ASSETS.has(l.a)){

    title = a.label || a.id; kind = assetType(a);
    const own = uniqueDocs(a.links.filter(x => !x.anchor));
    own.sort((x, y) => TYPE_ORDER.indexOf(x.t) - TYPE_ORDER.indexOf(y.t));
    const seen = new Set(own.map(fileKey));
    if (LIVE.has(a.id)) body += liveRows(LIVE.get(a.id));
    body += `<h3>Drawings</h3>` + own.map((x, k) => docRow(x, "doc", k === 0)).join("");
    if (!own.length && a.edited) body += `<div class="doc missing"><span class="ic" aria-hidden="true">${ICON.doc}</span><span class="dt"><b>No drawings linked yet</b><small>Turn on editing to add one.</small></span></div>`;
    if (a.links.some(x => x.m && !x.anchor)) body += missingRow();
    // documents filed in this location's folder
    const folder = uniqueDocs(LINKS.filter(x => !isBand(x) && x.u.toUpperCase().includes(`/DRAWINGS/${a.id}/`))).filter(x => !seen.has(fileKey(x)) && seen.add(fileKey(x)));
    if (folder.length) body += `<h3>In this location's folder</h3>` + folder.map(x => docRow(x)).join("");
    // another link sat on exactly the same spot in the PDF; show it rather than lose it
    const ids = new Set(a.links.map(x => x.i));
    const also = uniqueDocs(LINKS.filter(x => x.x !== undefined && ids.has(x.x))).filter(x => !seen.has(fileKey(x)));
    if (also.length) body += `<h3>Also linked here</h3>` + also.map(x => docRow(x)).join("");

    kind = "Drawing on the map";
    body = EDIT.on ? editDrawingRows(l) : "";
    r = l.r;
  } else {
    title = l.l || fileTitle(l);
    kind = l.t;
    body = `<h3>${l.u.startsWith("mailto:") ? "Email" : "Drawing"}</h3>` + (l.m ? missingRow(l) : docRow(l, l.t === "Link" ? "link" : "doc", true));
    if (l.l && l.l !== fileTitle(l)) body += `<div class="coords">Labelled ${esc(l.l)} on the map</div>`;
    r = markRect(l);

  else {

}

/* ================= search ================= */
const INDEX = [];
for (const a of ASSETS.values()) INDEX.push({ k: a.id, label: a.id, kind: assetType(a), r: a.mark, asset: a });
const seenLabel = new Set(ASSETS.keys());
for (const l of LINKS){
  if (!l.a && l.l && l.t !== "Directions" && !isBand(l) && !seenLabel.has(l.l.toUpperCase())){
    seenLabel.add(l.l.toUpperCase());
    INDEX.push({ k: l.l.toUpperCase(), label: l.l, kind: l.t, r: l.r, link: l });
  }
}
for (const t of DATA.labels){
  const key = t[0].toUpperCase().replace(/\s+/g, " ");
  if (seenLabel.has(key) || /^\d+(\.\d+)?\s*(kp|km\/h)?$/i.test(t[0]) || /ARRANGEMENT|BONDING PLANS|CONTROL TABLES|^\s*PLANS\s*$/i.test(t[0])) continue;
  seenLabel.add(key);
  INDEX.push({ k: key, label: t[0], kind: /STATION|PLATFORM/i.test(t[0]) ? "Station" : / (Rd|St|Lane|Bvd)\b|Creek|River|PX/i.test(t[0]) ? "Place" : "Label", r: [t[1], t[2], t[3], t[4]] });
}
// station names sit on the line above a "STATION" label
for (const st of DATA.labels.filter(t => /^STATION$/i.test(t[0].trim()))){
  let best = null, bd = 40;
  for (const e of INDEX){
    if (e.asset || e.link || e.kind === "Station") continue;
    const dy = st[2] - e.r[3], ox = Math.min(st[3], e.r[2]) - Math.max(st[1], e.r[0]);
    if (dy > -4 && dy < bd && ox > 0){ bd = dy; best = e; }
  }
  if (best){ best.kind = "Station"; best.r = [Math.min(best.r[0], st[1]), best.r[1], Math.max(best.r[2], st[3]), st[4]]; }
}
const BASE_INDEX = INDEX.slice();
let resItems = [], resOn = -1;
function search(q){
  q = q.trim().toUpperCase().replace(/\s+/g, " ");
  if (!q) return [];
  const out = [];
  for (const e of INDEX){
    const i = e.k.indexOf(q);
    if (i < 0) continue;
    const rank = (e.k === q ? 0 : i === 0 ? 1 : 2) * 10 + (e.asset ? 0 : e.kind === "Station" ? 1 : 3);
    out.push([rank, e.k.length, e]);
  }
  out.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return out.slice(0, 12).map(x => x[2]);
}
function showResults(){

  resItems = search(q); resOn = resItems.length ? 0 : -1;
  box.innerHTML = resItems.length ? resItems.map((e, k) =>
    `<button class="res${k === resOn ? " on" : ""}" role="option" data-k="${k}"><b>${esc(e.label)}</b><small>${esc(e.kind)}</small></button>`).join("")
    : `<div class="res empty">Nothing on the map matches “${esc(q.trim())}”. Try a signal number like MW291 or a station name.</div>`;
  box.classList.add("open");
}
function choose(e){
  $("#results").classList.remove("open");

/* ================= editor =================

     asset  a new asset            { type, label, x, y, links: [{ name, url }] }
     links  changes to an asset    { add: [{ name, url }], remove: [file name], rename }
     hide   takes an asset off the map
     draw   { shape: "line" | "rect" | "text", pts: [[x, y], ...], text, color }
   Each change is sent to the host as { type: "mantis:edit", op: "save" | "delete", id, kind, asset, data }. */
const EDIT = { on: false, tool: "select", color: "#d33a2c", list: [], draft: null, moving: null, local: false };
const ED_TYPES = ["Signal", "Points", "Location case", "UPS", "Signal equipment room", "Level crossing", "Track circuit", "Equipment"];
const ED_BOXED = ["Location case", "UPS", "Signal equipment room", "Equipment"];
const ED_COLORS = [["#d33a2c", "Red"], ["#2563c9", "Blue"], ["#1f8a4c", "Green"], ["#1d2a33", "Black"]];
const BASE_ASSETS = new Map(ASSETS);
const BASE_NAMES = Object.assign({}, NAMES);
// edits folded into the map file by build/apply_edits.py: drawn like any other edit, but not removable in the app
const BAKED = (DATA.baked_edits || []).map(normEdit).filter(Boolean);
const editsEl = $("#edits"), draftEl = $("#eddraft");
let DRAWN = [];
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const r1 = v => Math.round(v * 10) / 10;
function parseData(d){ if (d && typeof d === "object") return d; try { return JSON.parse(d || "{}") || {}; } catch(e){ return {}; } }
function normEdit(r){
  // accepts our own records or rows straight from the Dataverse table (Name, Kind, Asset, Data)
  const id = r.id || r.Name || r.name, kind = r.kind || r.Kind;
  if (!id || !kind) return null;
  return { id: String(id), kind: String(kind).toLowerCase(), asset: String(r.asset || r.Asset || ""), data: parseData(r.data !== undefined ? r.data : r.Data) };
}
function editRec(id){ return EDIT.list.find(e => e.id === id); }
function addedAssetRec(id){ return EDIT.list.find(e => e.kind === "asset" && e.asset === id); }
function edLink(a, k, j){
  return { i: `e:${a.id}:${j}`, a: a.id, t: a.edType || "Added drawing", u: k.url, f: String(k.url).split("?")[0].split("/").pop(), l: k.name, ed: 1, r: a.symR || a.mark, name: k.name };
}

// a new asset's symbol and label, drawn in map units like the PDF's own
function assetSvg(a, x, y){
  const t = a.edType, txt = esc(a.label || a.id);
  if (t === "Signal"){
    const fs = 16, w = txt.length * fs * .58;
    a.mark = [x - 12 - w, y - fs * .75, x - 12, y + fs * .25]; a.symR = [x - 9, y - 7, x + 7, y + 9];
    return `<path class="post" d="M${x - 8} ${y + 8}V${y}H${x - 6}"/><circle class="sig" cx="${x}" cy="${y}" r="6"/><text class="lbl" x="${x - 12}" y="${y + fs * .25}" font-size="${fs}" text-anchor="end">${txt}</text>`;
  }
  if (t === "Track circuit"){
    const fs = 9, w = txt.length * fs * .6;
    a.mark = a.symR = [x - w / 2, y - fs * .8, x + w / 2, y + fs * .2];
    return `<text class="tc" x="${x}" y="${y + fs * .2}" font-size="${fs}" text-anchor="middle">${txt}</text>`;
  }
  if (t === "Level crossing"){
    const fs = 14, w = txt.length * fs * .58;
    a.mark = [x + 10, y - fs * .75, x + 10 + w, y + fs * .25]; a.symR = [x - 7, y - 7, x + 7, y + 7];
    return `<path class="dia" d="M${x} ${y - 7}L${x + 7} ${y}L${x} ${y + 7}L${x - 7} ${y}Z"/><text class="lbl" x="${x + 10}" y="${y + fs * .25}" font-size="${fs}">${txt}</text>`;
  }
  const fs = ED_BOXED.includes(t) ? 12 : 14, w = txt.length * fs * .6 + 10, h = fs + 6;
  a.mark = a.symR = [x - w / 2, y - h / 2, x + w / 2, y + h / 2];
  return `<rect class="${ED_BOXED.includes(t) ? "bx" : "bxw"}" x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="${ED_BOXED.includes(t) ? 2 : 0}"/><text class="lbl" x="${x}" y="${y + fs * .35}" font-size="${fs}" text-anchor="middle">${txt}</text>`;
}
function drawingSvg(d, draft){
  const c = esc(d.color || "#d33a2c"), p = d.pts || [];
  if (d.shape === "line" && p.length) return `<polyline points="${p.map(q => q.join(",")).join(" ")}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` +
    (draft ? p.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="${c}"/>`).join("") : "");
  if (d.shape === "rect" && p.length === 2) return `<rect x="${Math.min(p[0][0], p[1][0])}" y="${Math.min(p[0][1], p[1][1])}" width="${Math.abs(p[1][0] - p[0][0])}" height="${Math.abs(p[1][1] - p[0][1])}" fill="none" stroke="${c}" stroke-width="2.5" rx="2"/>`;
  if (d.shape === "rect" && p.length === 1) return `<circle cx="${p[0][0]}" cy="${p[0][1]}" r="3" fill="${c}"/>`;
  if (d.shape === "text" && p.length) return `<text x="${p[0][0]}" y="${p[0][1]}" font-size="${+d.size || 14}" font-weight="600" fill="${c}">${esc(d.text || "")}</text>`;
  return "";
}
function drawingRect(d){
  const p = d.pts || [];
  if (!p.length) return null;
  if (d.shape === "text"){ const fs = +d.size || 14; return [p[0][0], p[0][1] - fs, p[0][0] + String(d.text || "").length * fs * .6, p[0][1] + 3]; }
  const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}

const HIDE_SKIP = ["Track circuit bonding", "Track circuit", "Axle counter overview"];
function piecesWithin(rects){
  const R = rects.map(([r, pad]) => [r[0] - pad, r[1] - pad, r[2] + pad, r[3] + pad]), out = [];
  const near = c => R.some(r => (c.cx + 1) * CELL > r[0] - 4 && c.cx * CELL < r[2] + 4 && c.cy * CELL + Y0 + CELL > r[1] - 4 && c.cy * CELL + Y0 < r[3] + 4);
  for (const c of CELLS){
    if (!near(c) || !c.el.closest("#L-base, #L-tpws")) continue;
    const was = c.el.style.display; c.el.style.display = "";
    for (const el of c.el.children){
      let b; try { b = el.getBBox(); } catch(err){ continue; }
      if (!b.width && !b.height) continue;
      const t = el.transform && el.transform.baseVal.consolidate(), m = t ? t.matrix : { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };
      const xs = [], ys = [];
      for (const [x, y] of [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]]){ xs.push(m.a * x + m.c * y + m.e); ys.push(m.b * x + m.d * y + m.f); }
      const x0 = Math.min(...xs), y0 = Math.min(...ys), x1 = Math.max(...xs), y1 = Math.max(...ys);
      if (R.some(r => x0 >= r[0] && y0 >= r[1] && x1 <= r[2] && y1 <= r[3])) out.push(el);
    }
    c.el.style.display = was;
  }
  return out;
}
function applyEdits(){
  document.querySelectorAll("#map .edhide").forEach(el => el.classList.remove("edhide"));
  ASSETS.clear();
  for (const [k, a] of BASE_ASSETS) ASSETS.set(k, Object.assign({}, a, { links: a.links.slice(), label: null, edited: false }));
  for (const k of Object.keys(NAMES)) if (!(k in BASE_NAMES)) delete NAMES[k];
  Object.assign(NAMES, BASE_NAMES);
  let shapes = "", syms = "";
  DRAWN = [];
  const ALL = BAKED.concat(EDIT.list);
  for (const e of ALL){
    if (e.kind !== "asset") continue;
    const d = e.data, id = String(d.label || e.asset || "").trim().toUpperCase().replace(/\s+/g, "");
    if (!id || !isFinite(d.x) || !isFinite(d.y)) continue;
    const a = { id, label: String(d.label || id).trim(), links: [], types: { [d.type || "Equipment"]: 1 }, edited: true, edType: d.type || "Equipment", editId: e.id };
    syms += `<g data-ed="${esc(e.id)}">${assetSvg(a, +d.x, +d.y)}</g>`;
    a.r = [Math.min(a.mark[0], a.symR[0]), Math.min(a.mark[1], a.symR[1]), Math.max(a.mark[2], a.symR[2]), Math.max(a.mark[3], a.symR[3])];
    a.links.push({ i: "e:" + e.id, a: id, t: a.edType, u: "", f: "", l: id, m: 1, anchor: 1, ed: 1, r: a.symR });
    (d.links || []).forEach((k, j) => a.links.push(edLink(a, k, j)));
    ASSETS.set(id, a); NAMES[id] = a.mark;
  }
  for (const e of ALL){
    const a = ASSETS.get(e.asset);
    if (!a) continue;
    if (e.kind === "hide"){
      // hide the drawing pieces that sit wholly inside the asset's name and symbols (track lines run past, so they stay)
      // signal heads are drawn with a halo a little outside the PDF's link box, so they get more room
      const rs = [[BASE_NAMES[a.id], 2.5]].concat(a.links.filter(l => !isBand(l) && !l.ed && !HIDE_SKIP.includes(l.t)).map(l => [l.r, l.t === "Signal" ? 4 : 2.5])).filter(x => x[0]);
      if (!a.editId) for (const el of piecesWithin(rs)) el.classList.add("edhide");
      ASSETS.delete(a.id); delete NAMES[a.id];
    } else if (e.kind === "links"){
      const d = e.data, rm = new Set((d.remove || []).map(x => String(x).toLowerCase()));
      a.links = a.links.filter(l => l.anchor || l.ed || !rm.has(fileKey(l)));
      (d.add || []).forEach((k, j) => a.links.push(Object.assign(edLink(a, k, "L" + j), { added: e.id })));
      if (d.rename) a.label = String(d.rename);
      if (!BAKED.includes(e)) a.changed = e.id;
    }
  }
  for (const e of ALL){
    if (e.kind !== "draw") continue;
    shapes += `<g data-ed="${esc(e.id)}">${drawingSvg(e.data)}</g>`;
    const r = drawingRect(e.data);
    if (r && !BAKED.includes(e)) DRAWN.push({ r, l: { drawing: e.data, edId: e.id, r, t: "Drawing", u: "" } });
  }
  editsEl.innerHTML = shapes + syms;
  buildTargets();
  INDEX.length = 0;
  for (const e of BASE_INDEX){
    if (e.asset){ const a = ASSETS.get(e.asset.id); if (a) INDEX.push(Object.assign({}, e, { asset: a, label: a.label || e.label })); }
    else if (!(e.link && e.link.a && !ASSETS.has(e.link.a))) INDEX.push(e);
  }
  for (const a of ASSETS.values()) if (a.editId) INDEX.push({ k: a.id, label: a.label, kind: assetType(a), r: a.mark, asset: a });
  refreshSelection();
}
function refreshSelection(){
  if (!selected || !$("#sheet").classList.contains("open")) return;
  const l = selected;
  if (l.drawing){ const d = DRAWN.find(x => x.l.edId === l.edId); d ? select(d.l) : closeSheet(); return; }
  const a = l.a && ASSETS.get(l.a);
  if (l.a && !a) closeSheet(); else if (a) select(primaryLink(a)); else select(l);
}

// ---------- saving
function sendEdit(m){
  if (EDIT.local){ store.set("edits", EDIT.list.map(e => Object.assign({}, e, { data: JSON.stringify(e.data) }))); return; }
  try { window.parent.postMessage(Object.assign({ type: "mantis:edit" }, m), "*"); } catch(e){}
}
function saveEdit(rec){
  const i = EDIT.list.findIndex(e => e.id === rec.id);
  if (i >= 0) EDIT.list[i] = rec; else EDIT.list.push(rec);
  applyEdits();
  sendEdit({ op: "save", id: rec.id, kind: rec.kind, asset: rec.asset || "", data: JSON.stringify(rec.data) });
}
function deleteEdit(id){
  if (!editRec(id)) return;
  EDIT.list = EDIT.list.filter(e => e.id !== id);
  applyEdits();
  sendEdit({ op: "delete", id });
}
function setEdits(list){
  EDIT.list = (Array.isArray(list) ? list : []).map(normEdit).filter(Boolean);
  applyEdits();
}

// ---------- form
let formDone = null;
function askForm(title, fields, note, saveLabel){
  return new Promise(res => {
    $("#edfTitle").textContent = title;
    $("#edfNote").textContent = note || "";
    $("#edfSave").textContent = saveLabel || "Save";
    $("#edfFields").innerHTML = fields.map((f, k) => `<label for="edf${k}">${esc(f.label)}</label>` + (f.options
      ? `<select id="edf${k}">${f.options.map(o => `<option${o === f.value ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`
      : `<input id="edf${k}" type="${f.type || "text"}" value="${esc(f.value || "")}" placeholder="${esc(f.ph || "")}"${f.req ? " required" : ""} autocapitalize="${f.caps ? "characters" : "off"}" spellcheck="false">`)).join("");
    $("#edlg").hidden = false;
    formDone = ok => { $("#edlg").hidden = true; formDone = null; res(ok ? fields.map((f, k) => $("#edf" + k).value.trim()) : null); };
    const first = $("#edfFields input,#edfFields select");
    if (first && !touchInput) first.focus();
  });
}
$("#edform").addEventListener("submit", e => { e.preventDefault(); if (formDone) formDone(true); });
$("#edlg").addEventListener("click", e => { if (e.target.closest('[data-act="fcancel"]') || e.target === $("#edlg")) formDone && formDone(false); });
const LINK_NOTE = "Paste the SharePoint link to the drawing (open it in SharePoint, then Copy link).";

// ---------- tools
function setTool(t){
  EDIT.tool = t; EDIT.draft = null; EDIT.moving = null; renderDraft();
  document.querySelectorAll("#edbar [data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === t));
  const hints = { asset: "Tap the map where the new asset goes.", line: "Tap points along the line.", rect: "Tap one corner of the box, then the opposite corner.", text: "Tap where the text goes." };
  hint(hints[t] || "");
}
function hint(text, finish){
  $("#edhint").hidden = !text;
  $("#edhintText").textContent = text || "";
  $('#edhint [data-act="finish"]').hidden = !finish;
}
function renderDraft(){ draftEl.innerHTML = EDIT.draft ? drawingSvg(EDIT.draft, true) : ""; }
function editTap(mx, my){
  if (s <= fitScale() * 2.2 && (EDIT.tool !== "select" || EDIT.moving)) return false;   // zoom in first, as for taps
  const p = [r1(mx), r1(my)];
  if (EDIT.moving){
    const rec = editRec(EDIT.moving);
    EDIT.moving = null; hint("");
    if (rec){ saveEdit(Object.assign({}, rec, { data: Object.assign({}, rec.data, { x: p[0], y: p[1] }) })); const a = ASSETS.get(rec.asset); if (a) select(primaryLink(a)); }
    return true;
  }
  const t = EDIT.tool;
  if (t === "select"){
    const tol = (touchInput ? 28 : 18) / s;
    const hit = DRAWN.find(d => dist2rect(mx, my, d.r) < tol);
    if (hit && !hitTest(mx, my)){ select(hit.l); return true; }
    return false;
  }
  if (t === "asset"){ placeAsset(p); return true; }
  if (t === "line"){
    EDIT.draft = EDIT.draft || { shape: "line", pts: [], color: EDIT.color };
    EDIT.draft.pts.push(p); renderDraft();
    hint(EDIT.draft.pts.length < 2 ? "Tap the next point." : "Keep tapping to add points, or Finish.", EDIT.draft.pts.length >= 2);
    return true;
  }
  if (t === "rect"){
    if (!EDIT.draft){ EDIT.draft = { shape: "rect", pts: [p], color: EDIT.color }; renderDraft(); hint("Now tap the opposite corner."); return true; }
    EDIT.draft.pts[1] = p;
    const d = EDIT.draft; EDIT.draft = null; renderDraft();
    saveEdit({ id: newId("d"), kind: "draw", asset: "", data: d });
    setTool("rect");
    return true;
  }
  if (t === "text"){
    askForm("Text on the map", [{ label: "Text", req: 1 }], "", "Add text").then(v => {
      if (v && v[0]) saveEdit({ id: newId("d"), kind: "draw", asset: "", data: { shape: "text", pts: [p], text: v[0], color: EDIT.color, size: 14 } });
    });
    return true;
  }
  return false;
}
async function placeAsset(p){
  const v = await askForm("New asset", [
    { label: "Asset ID (as written on the map)", ph: "e.g. WVS941", req: 1, caps: 1 },
    { label: "Type", options: ED_TYPES, value: "Signal" },
    { label: "Drawing name (optional)", ph: "e.g. WVS941G" },
    { label: "Drawing link (optional)", type: "url", ph: "https://vlineau.sharepoint.com/..." }], LINK_NOTE, "Place asset");
  if (!v || !v[0]) return;
  const id = v[0].toUpperCase().replace(/\s+/g, "");
  if (BASE_ASSETS.has(id) || addedAssetRec(id)){ await askForm(`${id} is already on the map`, [], "Search for it and add drawings from its panel instead.", "OK"); return; }
  const links = v[3] ? [{ name: v[2] || id, url: v[3] }] : [];
  saveEdit({ id: newId("a"), kind: "asset", asset: id, data: { label: v[0].trim(), type: v[1], x: p[0], y: p[1], links } });
  setTool("select");
  const a = ASSETS.get(id); if (a) select(primaryLink(a));
}
function finishDraft(){
  const d = EDIT.draft;
  if (d && d.shape === "line" && d.pts.length >= 2) saveEdit({ id: newId("d"), kind: "draw", asset: "", data: d });
  EDIT.draft = null; renderDraft(); setTool(EDIT.tool);
}
$("#edhint").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "finish") finishDraft();
  else { EDIT.moving = null; setTool("select"); }
});
$(".edcols").innerHTML = ED_COLORS.map(([c, n]) => `<button style="background:${c}" data-col="${c}" aria-label="${n}" role="radio"></button>`).join("");
function setColor(c){

setColor(EDIT.color);

// ---------- panel controls
function editRows(a){
  const added = addedAssetRec(a.id);
  const links = added ? (added.data.links || []).map((k, j) => ({ name: k.name, key: "n" + j, tag: "" }))
    : a.links.filter(l => !l.anchor && !isBand(l) && !l.m).map(l => ({ name: l.ed ? l.name : fileTitle(l), key: l.ed ? "a" + l.i.split(":L").pop() : "f" + fileKey(l), tag: l.ed ? "added" : "" }));
  let h = `<h3>Edit ${added ? "this new asset" : "this asset"}</h3>`;

function editDrawingRows(l){

    <div class="edrow">${l.drawing.shape === "text" ? `<button data-ed="retext">Change text</button>` : ""}<button data-ed="deldrawing" class="danger">Delete</button></div>`;

function linksRec(a){ return editRec("L:" + a.id) || { id: "L:" + a.id, kind: "links", asset: a.id, data: { add: [], remove: [] } }; }
function cloneRec(r){ return { id: r.id, kind: r.kind, asset: r.asset, data: JSON.parse(JSON.stringify(r.data)) }; }
$("#sBody").addEventListener("click", async e => {

    return;
  }

    else { const r = cloneRec(linksRec(a)); (r.data.add = r.data.add || []).push({ name: v[0], url: v[1] }); saveEdit(r); }
  } else if (act === "rmlink"){
    const k = b.dataset.k;
    if (added){ const r = cloneRec(added); r.data.links.splice(+k.slice(1), 1); saveEdit(r); return; }
    const r = cloneRec(linksRec(a));
    if (k[0] === "a") r.data.add.splice(+k.slice(1), 1);
    else (r.data.remove = r.data.remove || []).push(k.slice(1));
    saveEdit(r);
  } else if (act === "rename"){
    const v = await askForm(`Rename ${a.label || a.id}`, [{ label: "Name shown in the panel", value: a.label || a.id, req: 1 }]);
    if (!v || !v[0]) return;
    if (added){ const r = cloneRec(added); r.data.label = v[0]; r.asset = v[0].toUpperCase().replace(/\s+/g, ""); saveEdit(r); const n = ASSETS.get(r.asset); if (n) select(primaryLink(n)); }
    else { const r = cloneRec(linksRec(a)); r.data.rename = v[0]; saveEdit(r); }
  } else if (act === "move"){
    EDIT.moving = added.id; hint(`Tap the new spot for ${a.label || a.id}.`);
  } else if (act === "delasset"){
    const v = await askForm(`Delete ${a.label || a.id}?`, [], "This removes the asset you added, and its drawing links.", "Delete");
    if (v){ closeSheet(); deleteEdit(added.id); }
  } else if (act === "hide"){
    const v = await askForm(`Hide ${a.id} from the map?`, [], "It's covered over and can't be tapped or searched. Bring it back any time from Hidden assets.", "Hide");
    if (v){ closeSheet(); saveEdit({ id: "H:" + a.id, kind: "hide", asset: a.id, data: {} }); }
  } else if (act === "undo"){
    deleteEdit("L:" + a.id);
  }
});
async function showHidden(){
  const hidden = EDIT.list.filter(e => e.kind === "hide");
  if (!hidden.length){ await askForm("Hidden assets", [], "Nothing is hidden.", "OK"); return; }
  const v = await askForm("Bring back a hidden asset", [{ label: "Asset", options: hidden.map(e => e.asset) }], "", "Show on map");
  if (v) deleteEdit("H:" + v[0]);
}
function exportEdits(){
  const blob = new Blob([JSON.stringify(EDIT.list, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "mantis-edits.json"; a.click();
}
function setEditMode(on){
  EDIT.on = !!on;
  $("#edbar").hidden = !EDIT.on;
  document.body.classList.toggle("editing", EDIT.on);
  setTool("select");
  if (!EDIT.on) hint("");
  refreshSelection();
}

/* ================= start ================= */
minS = fitScale() * 0.85;
layoutSvg();
fitAll(false);
commit();
requestAnimationFrame(loop);
/* ---------- connecting other apps ----------
   Open Mantis on an asset:   Mantis_Sunshine.html#MW291   (or ?asset=MW291)
   From a host page/Power Apps wrapper:  postMessage({ type: "mantis:select", id: "MW291" })
   Mantis reports every selection back: { type: "mantis:selected", id, kind, title }  */
function findAsset(id){
  id = String(id || "").trim().toUpperCase().replace(/\s+/g, "");
  if (!id) return null;
  if (ASSETS.has(id)) return primaryLink(ASSETS.get(id));
  const e = INDEX.find(e => e.k.replace(/\s+/g, "") === id);
  return e ? (e.asset ? primaryLink(e.asset) : e.link || null) : null;
}
function announce(l, title, kind){
  const id = l.a || title;
  try { history.replaceState(null, "", "#" + encodeURIComponent(id)); } catch(e){}
  try { if (window.parent !== window) window.parent.postMessage({ type: "mantis:selected", id, kind, title }, "*"); } catch(e){}
  if (typeof window.Mantis.onSelect === "function") window.Mantis.onSelect({ id, kind, title });
}
window.Mantis = {
  select(id){ const l = findAsset(id); if (l){ select(l, true); return true; } return false; },
  assets(){ return [...ASSETS.values()].map(a => ({ id: a.id, kind: assetType(a), x: a.mark[0], y: a.mark[1] })); },
  onSelect: null
};
window.Mantis.setUiScale = k => {
  k = Math.min(1.4, Math.max(1, +k || 1));
  uiK = k;
  root.style.setProperty("--ui", k.toFixed(3));
  minS = fitScale() * 0.85; clamp(); layoutSvg(); commit(); mark();
  return k;
};
window.addEventListener("message", e => {
  const d = e.data || {};
  if (d.type === "mantis:select") window.Mantis.select(d.id);
  else if (d.type === "mantis:ui") window.Mantis.setUiScale(d.k);
  else if (d.type === "mantis:edits") setEdits(d.list);
  else if (d.type === "mantis:editmode") setEditMode(d.on);
});
window.Mantis.setEdits = setEdits;
window.Mantis.setEditMode = setEditMode;
window.Mantis.edits = () => EDIT.list.map(e => Object.assign({}, e));
// try the editor in a plain browser: Mantis_Sunshine.html?edit=1 (edits stay in this browser; Export edits to save them)
if (BAKED.length) applyEdits();
(function localEditing(){
  let on = false;
  try { on = new URLSearchParams(location.search).get("edit") === "1"; } catch(e){}
  if (!on || window.MANTIS_EMBED) return;
  EDIT.local = true;
  $('#edbar [data-act="export"]').hidden = false;
  setEdits(store.get("edits", []));
  setEditMode(true);
})();
// inside a Power Apps code component the host can ask for links to be handed back (some players block pop-ups)
if (window.MANTIS_EMBED && window.MANTIS_EMBED.links === "app") document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a[href]");
  if (!a || a.getAttribute("href") === "#") return;
  e.preventDefault();
  window.parent.postMessage({ type: "mantis:open", url: a.href }, "*");
});
(function openFromLink(){
  let id = "";
  try { id = new URLSearchParams(location.search).get("asset") || decodeURIComponent(location.hash.slice(1)); } catch(e){}
  if (id) setTimeout(() => window.Mantis.select(id), 60);
})();
// hooks used by automated checks (harmless in normal use)
window.__mantisTest = {
  view(x, y, sc){ s = sc; tx = vw() / 2 - x * sc; ty = vh() / 2 - (y - Y0) * sc; clamp(); commit(); mark(); },
  screen(x, y){ return [x * s + tx, (y - Y0) * s + ty]; },
  sweep(sc){
    const old = s; s = sc; const out = { names: [0, 0, []], links: [0, 0, []] };
    for (const [id, r] of Object.entries(NAMES)){
      const h = hitTest((r[0] + r[2]) / 2, (r[1] + r[3]) / 2); out.names[0]++;
      if (h && h.a === id) out.names[1]++; else out.names[2].push([id, h ? (h.a || h.l || h.f) : null]);
    }
    for (const l of LINKS){
      if (isBand(l) || l.t === "Directions" || l.x !== undefined) continue;
      const h = hitTest(l.cx, l.cy); out.links[0]++;
      const same = h && (h === l || (l.a && h.a === l.a) || (!l.a && h.u === l.u));
      if (same) out.links[1]++; else out.links[2].push([l.a || l.l || l.f, h ? (h.a || h.l || h.f) : null]);
    }
    s = old; return out;
  }
};
})();
